<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 320) rotate(90) scale(250)">
      <stop stop-color="#FEE101" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#FFB52E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF087C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <style>
      .ring { transform-box: fill-box; transform-origin: center; animation: ringPulse 2.4s ease-out infinite; }
      .ring-two { animation-delay: .8s; }
      .ring-three { animation-delay: 1.6s; }
      .orbit { transform-origin: 320px 320px; animation: orbit 18s linear infinite; }
      .orbit-reverse { transform-origin: 320px 320px; animation: orbit 25s linear infinite reverse; }
      .bar { transform-box: fill-box; transform-origin: center; animation: voiceBar .82s ease-in-out infinite alternate; }
      .b2,.b8,.b14,.b20 { animation-delay: -.1s; }
      .b3,.b9,.b15,.b21 { animation-delay: -.28s; }
      .b4,.b10,.b16,.b22 { animation-delay: -.42s; }
      .b5,.b11,.b17,.b23 { animation-delay: -.58s; }
      .b6,.b12,.b18,.b24 { animation-delay: -.7s; }
      .mic { transform-origin: 320px 320px; animation: micBeat 1.6s ease-in-out infinite; }
      .signal { stroke-dasharray: 8 12; animation: signalMove 1.1s linear infinite; }
      @keyframes ringPulse { 0% { transform: scale(.78); opacity: .72; } 75%,100% { transform: scale(1.16); opacity: 0; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes voiceBar { from { transform: scaleY(.26); opacity: .55; } to { transform: scaleY(1); opacity: 1; } }
      @keyframes micBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
      @keyframes signalMove { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) {
        .ring,.orbit,.orbit-reverse,.bar,.mic,.signal { animation: none !important; }
      }
    </style>
  </defs>

  <circle cx="320" cy="320" r="250" fill="url(#glow)"/>
  <circle class="ring" cx="320" cy="320" r="180" stroke="#48D9D0" stroke-width="5"/>
  <circle class="ring ring-two" cx="320" cy="320" r="180" stroke="#FEE101" stroke-width="5"/>
  <circle class="ring ring-three" cx="320" cy="320" r="180" stroke="#FF087C" stroke-width="5"/>

  <circle class="orbit" cx="320" cy="320" r="226" stroke="#48D9D0" stroke-width="4" stroke-dasharray="5 18" stroke-linecap="round"/>
  <circle class="orbit-reverse" cx="320" cy="320" r="264" stroke="#FF087C" stroke-width="3" stroke-dasharray="2 19" stroke-linecap="round"/>

  <g stroke="#061A14" stroke-width="5">
    <circle cx="320" cy="56" r="9" fill="#FEE101"/>
    <circle cx="584" cy="320" r="9" fill="#48D9D0"/>
    <circle cx="320" cy="584" r="9" fill="#FF087C"/>
    <circle cx="56" cy="320" r="9" fill="#FEE101"/>
  </g>

  <g fill="#48D9D0">
    <rect class="bar b1" x="80" y="292" width="8" height="56" rx="4"/><rect class="bar b2" x="96" y="276" width="8" height="88" rx="4"/>
    <rect class="bar b3" x="112" y="300" width="8" height="40" rx="4"/><rect class="bar b4" x="128" y="264" width="8" height="112" rx="4"/>
    <rect class="bar b5" x="144" y="286" width="8" height="68" rx="4"/><rect class="bar b6" x="160" y="302" width="8" height="36" rx="4"/>
  </g>
  <g fill="#FEE101">
    <rect class="bar b7" x="176" y="278" width="8" height="84" rx="4"/><rect class="bar b8" x="192" y="294" width="8" height="52" rx="4"/>
    <rect class="bar b9" x="208" y="260" width="8" height="120" rx="4"/><rect class="bar b10" x="224" y="286" width="8" height="68" rx="4"/>
    <rect class="bar b11" x="240" y="302" width="8" height="36" rx="4"/><rect class="bar b12" x="256" y="274" width="8" height="92" rx="4"/>
  </g>
  <g fill="#FF087C">
    <rect class="bar b13" x="376" y="274" width="8" height="92" rx="4"/><rect class="bar b14" x="392" y="302" width="8" height="36" rx="4"/>
    <rect class="bar b15" x="408" y="286" width="8" height="68" rx="4"/><rect class="bar b16" x="424" y="260" width="8" height="120" rx="4"/>
    <rect class="bar b17" x="440" y="294" width="8" height="52" rx="4"/><rect class="bar b18" x="456" y="278" width="8" height="84" rx="4"/>
  </g>
  <g fill="#48D9D0">
    <rect class="bar b19" x="472" y="302" width="8" height="36" rx="4"/><rect class="bar b20" x="488" y="286" width="8" height="68" rx="4"/>
    <rect class="bar b21" x="504" y="264" width="8" height="112" rx="4"/><rect class="bar b22" x="520" y="300" width="8" height="40" rx="4"/>
    <rect class="bar b23" x="536" y="276" width="8" height="88" rx="4"/><rect class="bar b24" x="552" y="292" width="8" height="56" rx="4"/>
  </g>

  <g class="mic">
    <circle cx="320" cy="320" r="108" fill="#FFFaf0" stroke="#061A14" stroke-width="9"/>
    <circle cx="320" cy="320" r="91" fill="#FEE101" stroke="#FF087C" stroke-width="5"/>
    <rect x="294" y="248" width="52" height="96" rx="26" fill="#061A14"/>
    <rect x="306" y="260" width="28" height="72" rx="14" fill="#FFFaf0"/>
    <path d="M275 317v5c0 25 20 45 45 45s45-20 45-45v-5M320 367v28M294 395h52" stroke="#061A14" stroke-width="10" stroke-linecap="round"/>
  </g>

  <path class="signal" d="M222 446c50 30 146 30 196 0" stroke="#48D9D0" stroke-width="5" stroke-linecap="round"/>
</svg>
